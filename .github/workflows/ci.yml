name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { throw "Unformatted Go files: $files" }
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race '-coverprofile=coverage.out' ./...
      - name: Smoke test executable
        shell: pwsh
        run: ./scripts/smoke.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify machine-readable contracts
        shell: pwsh
        run: |
          python -m pip install jsonschema==4.25.1
          if ($LASTEXITCODE) { throw 'Schema validator installation failed' }
          go build -o build/schema-check.exe .
          if ($LASTEXITCODE) { throw 'Build failed' }
          python scripts/check-schemas.py build/schema-check.exe
          if ($LASTEXITCODE) { throw 'Schema contract validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Scan for known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test ./internal/detect -run=^$ -fuzz=FuzzFind -fuzztime=20s
  packages:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - shell: pwsh
        run: ./scripts/release.ps1 -Commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-packages
          path: dist/
